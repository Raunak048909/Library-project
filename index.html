<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
<script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="heading">
                <i class="mdi mdi-library"></i>
                <span>Library</span>
            </div>
            <button id="add-books">Add Books</button>
            <div class="books-data"><div class="no-of-books">#No of books </div>
            <div class="books-finished">#Books Finished</div>
            <div class="unread-books">#Unread Books</div>
        </div></div>
        <div class="card-section"></div>
    </div>
    <div id="modalContainer" class="hidden-form">
    <form id="add-bookform" >
        <div class="form-group">
<label for="book-title">Title:</label>
<input type="text" id="book-title" name="title" placeholder="Title of the Book">
</div>

<div class="form-group">
<label for="author-name">Author Name:</label>
<input type="text" id="author-name" name="author" placeholder="Author Name">
</div>

<div class="form-group">
<label for="pages-count">Pages:</label>
<input type="number" id="pages-count" name="pages" placeholder="Number of pages">
</div>

<div class="checkbox-group">
<input type="checkbox" id="readed" name="yes">
<label for="readed">Book Read</label>
</div>

<div id="form-button">
<button type="submit" id="submit">Submit</button>
<button type="button" id="cancel">Cancel</button>
</div>
    </form></div>
</body>
</html>
